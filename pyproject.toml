[project]
name = "binary-master"
version = "0.4.0"
description = "High-speed declarative binary serializer and deserializer with C/Rust/C++/C#/Go/Wireshark code generation and documentation generator"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Tamon Ishii" },
]
keywords = [
    "binary",
    "serializer",
    "deserializer",
    "protocol",
    "struct",
    "endian",
    "packet",
    "code-generator",
    "hexdump",
    "wireshark",
    "asyncio",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
requires-python = ">=3.14"
dependencies = []

[project.urls]
Homepage = "https://github.com/tamon-ishii/binary_master"
Repository = "https://github.com/tamon-ishii/binary_master.git"
Issues = "https://github.com/tamon-ishii/binary_master/issues"
Documentation = "https://github.com/tamon-ishii/binary_master#readme"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.25.0",
    "mypy>=1.15.0",
    "ruff>=0.9.9",
    "tach>=0.35.1",
]

[project.scripts]
binary-master = "binary_master.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F821", "F841", "F722"]
"sample/*" = ["F821", "F841", "F722"]

[tool.mypy]
python_version = "3.14"
packages = ["binary_master"]
mypy_path = "src"
strict_optional = true
warn_unused_ignores = true
check_untyped_defs = true
